<!DOCTYPE html>
<html>
<head>
    <title>Student Dropout Prediction</title>
</head>
<body>
    <h2>Enter Student Details</h2>
    <form action="/predict" method="post">
        School: <input type="text" name="School"><br>
        Gender: <input type="text" name="Gender"><br>
        Age: <input type="number" name="Age"><br>
        Number of Failures: <input type="number" name="Number_of_Failures"><br>
        Travel Time: <input type="number" name="Travel_Time"><br>
        Study Time: <input type="number" name="Study_Time"><br>
        Grade 1: <input type="number" name="Grade_1"><br>
        Grade 2: <input type="number" name="Grade_2"><br>
        Final Grade: <input type="number" name="Final_Grade"><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
